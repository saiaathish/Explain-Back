services:
  - type: web
    name: explain-back-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_ROLE
        value: "prod"
      - key: LLM_MODEL_PROD
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: T_HIGH
        value: "0.732"
      - key: T_LOW
        value: "0.680"
