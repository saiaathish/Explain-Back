services:
  - type: web
    name: explain-back-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: LLM_BASE_URL
        value: https://api.openai.com/v1
      - key: FRONTEND_ORIGIN
        sync: false
      - key: T_HIGH
        value: "0.870"
      - key: T_LOW
        value: "0.680"
